[tool.taskipy.tasks]
dev = "uvicorn app.main:app --reload"
start = "uvicorn app.main:app"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

init_alembic = "alembic init -t async alembic"
table_update = 'alembic revision --autogenerate -m "Initial tables for repos, PRs, and vulns"'
db_push = "alembic upgrade head"
db_sync = "python scripts/sync_db.py"